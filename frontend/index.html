<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>B2 Web RViz</title>

    <!-- PWA manifest (Android / Chrome / Safari desktop) -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <!-- iOS "Add to Home Screen" — makes it open full-screen from home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B2 RViz" />

    <!-- iOS home screen icons (iPad uses 167 or 180; iPhone uses 152 or 180) -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%BASE_URL%apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="%BASE_URL%apple-touch-icon-167.png" />

    <!-- Theme colour for Android address bar / task switcher -->
    <meta name="theme-color" content="#00d0b6" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #121212; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
