server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy REST API to ROS 2 gateway ──────────────────────────────────────
    # ${GATEWAY_URL} is substituted from the GATEWAY_URL env var at container start.
    location /api/ {
        proxy_pass ${GATEWAY_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── Proxy WebSocket to ROS 2 gateway ─────────────────────────────────────
    location /ws/ {
        proxy_pass ${GATEWAY_URL}/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ── Frontend SPA at /app/ ─────────────────────────────────────────────────
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Static assets — immutable (Vite content-hashed filenames) ────────────
    location ~* \.(js|css|woff2?|png|svg|ico|dae|stl)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
