services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: b2-web-rviz-frontend:latest
    container_name: b2_web_rviz_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # nginx proxies /api/* and /ws/* to this URL at container start.
      # Set GATEWAY_URL in .env to point at the robot running the ROS 2 gateway.
      - GATEWAY_URL=${GATEWAY_URL:-http://192.168.123.1:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
